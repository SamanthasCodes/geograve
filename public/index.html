<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Geograve — Mapping the Avian World</title>
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>

<body>
  <div id="canvas">

    <div id="header-panel" class="panel">
      <h1 class="wordmark">Geogr<span class="accent">ave</span></h1>
      <p class="tagline">Mapping the Avian World</p>
    </div>

    <div id="info-panel" class="panel">
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Search a species…" autocomplete="off" />
      </div>
      <div id="species-card" class="species-card"></div>
    </div>

    <div id="globe-panel" class="panel">
      <div id="timeline">
        <button id="timeline-play" class="timeline-play" type="button" aria-label="Play">
          <img id="timeline-play-icon" src="icons/play.png" alt="" />
        </button>
        <div id="timeline-track" class="timeline-track">
          <div id="timeline-progress" class="timeline-progress"></div>
        </div>
        <div id="timeline-label" class="timeline-label">Select a Species</div>
      </div>
      <svg id="globe-svg"></svg>

      <div id="globe-legend">
        <div class="legend-row legend-heatmap">
          <span class="legend-caption">ABUNDANCE</span>
          <span class="legend-low">low</span>
          <span class="legend-bar"></span>
          <span class="legend-high">high</span>
        </div>
        <div class="legend-row legend-biomes">
          <span class="biome-item"><span class="biome-swatch" style="background:#2D6A4F"></span>Forest</span>
          <span class="biome-item"><span class="biome-swatch" style="background:#8DB048"></span>Grassland &amp; Savanna</span>
          <span class="biome-item"><span class="biome-swatch" style="background:#D4956A"></span>Desert</span>
          <span class="biome-item"><span class="biome-swatch" style="background:#7FB8D4"></span>Tundra &amp; Ice</span>
          <span class="biome-item"><span class="biome-swatch" style="background:#2BBFB0"></span>Wetlands &amp; Coast</span>
          <span class="biome-item"><span class="biome-swatch" style="background:#2E6BA8"></span>Ocean</span>
        </div>
      </div>

      <div id="loading-overlay">
        <div class="spinner" aria-label="Loading map"></div>
      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/globe.js"></script>
  <script src="js/search.js"></script>
  <script src="js/card.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
